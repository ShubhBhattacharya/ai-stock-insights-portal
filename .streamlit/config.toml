[theme]
base = "dark"
primaryColor = "#00f0ff"
backgroundColor = "#070312"
secondaryBackgroundColor = "#120826"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"
